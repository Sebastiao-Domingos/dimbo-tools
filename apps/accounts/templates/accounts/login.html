{% extends 'base.html' %}

{% block title %}Entrar - Dimbo Tools{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-xl">
    <h1 class="text-2xl font-bold text-center text-gray-800">Entrar</h1>
    <p class="text-center text-gray-500 mb-6">Aceda à sua conta</p>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="mb-4">
            <label class="block text-gray-700 font-medium mb-2">Email ou nome de utilizador</label>
            {{ form.username }}
        </div>
        
        <div class="mb-4">
            <label class="block text-gray-700 font-medium mb-2">Palavra-passe</label>
            {{ form.password }}
        </div>
        
        <div class="mb-6 text-right">
            <a href="{% url 'accounts:password_reset' %}" class="text-sm text-blue-600 hover:underline">Esqueceu a palavra-passe?</a>
        </div>
        
        <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition">Entrar</button>
    </form>
    
    <p class="text-center text-gray-600 text-sm mt-6">
        Não tem conta? <a href="{% url 'accounts:register' %}" class="text-blue-600 hover:underline">Criar conta grátis</a>
    </p>
</div>
{% endblock %}
