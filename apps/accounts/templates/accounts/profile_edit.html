{% extends 'base.html' %}

{% block title %}Editar perfil - Dimbo Tools{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-lg">
    <h1 class="text-2xl font-bold mb-6">Editar perfil</h1>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="space-y-4">
            {{ form.as_p }}
        </div>
        
        <div class="flex justify-end gap-3 mt-6">
            <a href="{% url 'accounts:profile' %}" class="px-4 py-2 border rounded-lg hover:bg-gray-50">Cancelar</a>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Guardar alterações</button>
        </div>
    </form>
</div>
{% endblock %}
