{% extends 'base.html' %}
{% block title %}Recuperar palavra-passe{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg">
    <h1 class="text-2xl font-bold mb-4">Recuperar palavra-passe</h1>
    <p class="text-gray-600 mb-6">Digite o seu email e enviaremos um link para redefinir a palavra-passe.</p>
    <form method="post">
        {% csrf_token %}
        <input type="email" name="email" class="w-full px-4 py-2 border rounded-lg" placeholder="seu@email.com">
        <button type="submit" class="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg">Enviar link</button>
    </form>
</div>
{% endblock %}
