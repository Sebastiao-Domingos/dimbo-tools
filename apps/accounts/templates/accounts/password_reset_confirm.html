{% extends 'base.html' %}
{% block title %}Nova palavra-passe{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg">
    <h1 class="text-2xl font-bold mb-4">Definir nova palavra-passe</h1>
    <form method="post">
        {% csrf_token %}
        <input type="password" name="new_password1" placeholder="Nova palavra-passe" class="w-full mb-3 px-4 py-2 border rounded-lg">
        <input type="password" name="new_password2" placeholder="Confirmar palavra-passe" class="w-full mb-3 px-4 py-2 border rounded-lg">
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg">Redefinir</button>
    </form>
</div>
{% endblock %}
